version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Editor packages are released together and must stay in step.
      codemirror:
        patterns: ['@codemirror/*', '@lezer/*']
      build-tools:
        patterns: ['vite', 'electron-vite', '@vitejs/*', 'vitest', 'typescript', 'prettier', 'oxlint']
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
    ignore:
      # Major Electron upgrades change Chromium and Node; do them deliberately, not from a bot.
      - dependency-name: electron
        update-types: ['version-update:semver-major']
      # electron-vite only supports Vite up to 7 in its stable release; Vite 8 (and plugin-react 6, which
      # needs it) wait until it does.
      - dependency-name: vite
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitejs/plugin-react'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
