name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The checks don't launch the app, so skip the ~100 MB Electron download.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # Python cells are tested against a real Python, with the packages they most often use.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install pandas matplotlib
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run server:build
      - run: npm run notices -- --check
      - run: npm run site

  # Years of notes: a generated vault of 10,000 notes must open, search and follow outside edits in time.
  scale:
    name: Large vault
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: xvfb-run -a npm run e2e:scale

  python:
    name: Python package (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The oldest Python the package supports, and a current one.
        python: ['3.9', '3.13']
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      # The team-server tests run against the real server. Building it needs no Electron, so skip
      # install scripts (the Electron download) and that download can't fail this job.
      - run: npm ci --ignore-scripts
      - run: npm run server:build
      - run: pip install -e "python[pandas]" matplotlib pytest build
      - run: pytest python/tests
      - name: Build the wheel and install it on its own
        run: |
          python -m build python --outdir dist-python
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist-python/*.whl
          /tmp/clean/bin/python -c "import prem; print(prem.__version__)"

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install pandas matplotlib
      # These launch the real app, so they need the Electron binary.
      - run: npm ci
      - run: npm run build
      - run: npm run server:build
      - run: xvfb-run -a npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
