# Packaging for macOS, Windows and Linux. Run `npm run package` for the current platform;
# the release workflow (.github/workflows/release.yml) builds all three on tagged versions.
appId: io.github.cameronjtoy.prem
productName: Prem
copyright: Copyright © 2026 Prem contributors
artifactName: Prem-${version}-${os}-${arch}.${ext}

directories:
  output: dist
  buildResources: build

# Everything the app needs is bundled into out/ by electron-vite, so no node_modules are shipped.
files:
  - out/**
  - package.json
  - '!out/server/**'
  - '!**/*.map'

extraResources:
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  - from: LICENSE
    to: LICENSE

# Ad-hoc signs the macOS app when no Developer ID certificate is configured (see build/afterPack.cjs).
afterPack: build/afterPack.cjs

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # Unsigned until a Developer ID certificate is added as CSC_LINK / CSC_KEY_PASSWORD secrets.
  # Then set identity back to its default (remove this line) and turn on hardenedRuntime and notarize.
  identity: null
  hardenedRuntime: false

dmg:
  title: Prem ${version}

win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true

linux:
  category: Science
  syncDesktopName: true
  icon: build/icons
  synopsis: Open-source lab notebook that runs on your own machines
  description: Protocols, protocol runs, samples, attachments and signed records, stored as plain markdown files you own.
  maintainer: Prem contributors <https://github.com/cameronjtoy/Prem>
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]

# Releases are published by the workflow, not by electron-builder.
publish: null
