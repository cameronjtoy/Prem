<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" width="680" height="430" role="img" aria-labelledby="title desc">
<title id="title">How Prem fits together</title>
<desc id="desc">Prem reads and writes plain markdown files in a vault folder you own, with every save kept in a hash-chained history. Python cells and scripts write results into the same notes. An optional lab server shares one vault with a team, with roles and per-folder permissions.</desc>
<!-- Drawn by scripts/site-diagrams.mjs; edit that, not this file. -->
<style>
