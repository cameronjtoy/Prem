<rect width="680" height="430" class="bg"/>
<rect x="16" y="16" width="404" height="398" rx="12" class="panel"/>
<text x="32" y="40" class="lane">ON YOUR COMPUTER</text>
<rect x="36" y="56" width="364" height="70" rx="9" class="key"/>
<text x="50" y="81" class="t">Prem</text>
<text x="50" y="101" class="s">Notes, protocols, runs, jobs and the board</text>
<text x="50" y="119" class="s">Signing, history, search and PDF export</text>
<rect x="36" y="186" width="364" height="122" rx="9" class="box"/>
<text x="50" y="211" class="t">Your vault: a folder you own</text>
<text x="50" y="231" class="m">Notebook/2026/Ligation of insert.md</text>
<text x="50" y="249" class="m">Protocols/  Workflows/  Jobs/  Samples/</text>
<text x="50" y="267" class="m">attachments/gel.png  plate.csv</text>
<text x="50" y="285" class="m">.prem/history/  every save, hash-chained</text>
<path d="M218,126 L218,186" class="edge" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="228" y="160" class="label">plain markdown files</text>
<rect x="36" y="336" width="172" height="62" rx="9" class="box"/>
<text x="50" y="361" class="t">Python</text>
<text x="50" y="381" class="s">Cells, scripts, Jupyter</text>
<rect x="228" y="336" width="172" height="62" rx="9" class="ghost"/>
<text x="242" y="361" class="t">Other apps</text>
<text x="242" y="381" class="s">Any editor, sync or git</text>
<path d="M122,336 L122,308" class="edge" marker-end="url(#a)"/>
<text x="130" y="326" class="label">figures, results</text>
<path d="M314,336 L314,308" class="edge dash" marker-end="url(#a)"/>
<text x="322" y="326" class="label">recorded too</text>
<text x="458" y="112" class="lane">OPTIONAL</text>
<rect x="450" y="124" width="214" height="170" rx="9" class="box"/>
<text x="464" y="149" class="t">Lab server</text>
<text x="464" y="169" class="s">One shared vault for the lab</text>
<text x="464" y="187" class="s">Roles: PI, member, viewer</text>
<text x="464" y="205" class="s">Permissions per folder</text>
<text x="464" y="223" class="s">Who changed what comes</text>
<text x="464" y="241" class="s">from each person's token</text>
<path d="M400,92 L424,92 L424,160 L450,160" class="edge key-edge" marker-end="url(#k)" marker-start="url(#k)"/>
<text x="458" y="318" class="label">Connected over HTTPS,</text>
<text x="458" y="334" class="label">with one token per person</text>
