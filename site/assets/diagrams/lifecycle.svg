<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 500" width="1220" height="500" role="img" aria-labelledby="title desc">
<title id="title">How a record moves through Prem</title>
<desc id="desc">A workflow starts jobs; each job stage starts a run of a protocol; completing a run completes the stage and hands the job on. Runs and jobs are signed, witnessed and locked, and exported to PDF. Python cells and the prem package write analysis into the same entries, and every change is kept in the history.</desc>
