<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker>
  <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head key-head"/></marker>
</defs>
<rect width="900" height="350" class="bg"/>
<text x="20" y="34" class="lane">IN THE NOTE</text>
<rect x="20" y="46" width="400" height="92" rx="9" class="box"/>
<text x="34" y="70" class="m">```python {run}</text>
<text x="34" y="90" class="m">df = pd.read_csv("attachments/plate.csv")</text>
<text x="34" y="110" class="m">df.groupby("sample").od.mean()</text>
<text x="34" y="130" class="m">```</text>
<path d="M220,138 L220,166" class="edge" marker-end="url(#a)"/>
<text x="230" y="158" class="label">Run</text>
<rect x="20" y="166" width="400" height="112" rx="9" class="key"/>
<text x="34" y="190" class="t">Output, saved in the note</text>
<text x="34" y="212" class="m">sample A 0.41 · sample B 0.88</text>
<rect x="34" y="226" width="101.8" height="20" rx="10" class="chip"/>
<text x="84.9" y="240" class="chip-text" text-anchor="middle">code 3f2a91c0</text>
<rect x="143.8" y="226" width="101.8" height="20" rx="10" class="chip"/>
<text x="194.70000000000002" y="240" class="chip-text" text-anchor="middle">Python 3.12.4</text>
<rect x="253.60000000000002" y="226" width="121.6" height="20" rx="10" class="chip"/>
<text x="314.40000000000003" y="240" class="chip-text" text-anchor="middle">env 9b1e2c3d4f5a</text>
<rect x="34" y="252" width="181" height="20" rx="10" class="chip"/>
<text x="124.5" y="266" class="chip-text" text-anchor="middle">read plate.csv @ a41c0e12</text>
<path d="M220,278 L220,306" class="edge" marker-end="url(#a)"/>
<rect x="20" y="306" width="400" height="30" rx="8" class="box"/>
<text x="34" y="326" class="m">attachments/environment-9b1e2c3d4f5a.txt</text>
<text x="480" y="34" class="lane">LATER, ON ANY COMPUTER</text>
<rect x="480" y="46" width="400" height="70" rx="9" class="warn"/>
<text x="494" y="71" class="t">If plate.csv changes</text>
<text x="494" y="91" class="s">The output is flagged, and so are the cells after it:</text>
<text x="494" y="109" class="s">"plate.csv changed since this output"</text>
<rect x="480" y="140" width="400" height="92" rx="9" class="key"/>
<text x="494" y="165" class="t">Reproduce</text>
<text x="494" y="185" class="s">1  Rebuild environment 9b1e2c3d4f5a exactly</text>
<text x="494" y="203" class="s">2  Rerun the cells in a fresh Python</text>
<text x="494" y="221" class="s">3  Compare text, tables and figures byte for byte</text>
<path d="M420,321 L450,321 L450,186 L480,186" class="edge key-edge" marker-end="url(#k)"/>
<rect x="480" y="256" width="194" height="80" rx="9" class="done"/>
<text x="494" y="282" class="t">Same</text>
<text x="494" y="302" class="s">All 2 outputs are the</text>
<text x="494" y="320" class="s">same as recorded.</text>
<rect x="686" y="256" width="194" height="80" rx="9" class="warn"/>
<text x="700" y="282" class="t">Different</text>
<text x="700" y="302" class="s">Printed text: different</text>
<text x="700" y="320" class="s">Figure 1: same</text>
<path d="M620,232 L578,256" class="edge" marker-end="url(#a)"/>
<path d="M740,232 L782,256" class="edge" marker-end="url(#a)"/>
</svg>
