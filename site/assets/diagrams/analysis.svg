<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350" role="img" aria-labelledby="title desc">
<title id="title">Reproducible analysis in a note</title>
<desc id="desc">A Python cell runs in the note. Its output is saved under it with the code version, the Python and environment it ran in, and the files it read with their hashes. The environment’s full package list is saved next to the note. Reproduce rebuilds that environment, reruns the cells and says which outputs are the same.</desc>
<!-- Drawn by scripts/site-diagrams.mjs; edit that, not this file. -->
<style>
  .bg { fill: #faf9f5 } .panel { fill: #f2f0e9; stroke: #e5e2d9 }
