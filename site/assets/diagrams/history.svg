<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-labelledby="title desc">
<title id="title">A note's history</title>
<desc id="desc">Each save of a note is an entry in its history, and each entry includes the hash of the one before, so changing any past version or signature breaks the chain. Signing locks the note; a colleague witnesses it; later changes are amendments with a reason. Edits made outside Prem are recorded too, and flagged on a signed note.</desc>
